name: Build Releases (Windows & Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Windows Patcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd patcher
          npm ci
          cargo tauri build --no-bundle
          cd ..
          New-Item -ItemType Directory -Force -Path release_pkg\custom_wallpapers | Out-Null
          Copy-Item patcher\src-tauri\target\release\ave-maria-patcher.exe release_pkg\AntigravityPatcher.exe
          Copy-Item -Recurse customization release_pkg\customization
          Copy-Item custom_wallpapers\README.txt release_pkg\custom_wallpapers\README.txt
          Copy-Item README.md, LICENSE release_pkg\
          Compress-Archive -Path release_pkg\* -DestinationPath AntigravityPatcher-windows-x64.zip -Force

      - name: Build Linux Patcher
        if: runner.os == 'Linux'
        run: |
          cd patcher
          npm ci
          cargo tauri build --no-bundle
          cd ..
          mkdir -p release_pkg/custom_wallpapers
          cp patcher/src-tauri/target/release/ave-maria-patcher release_pkg/AntigravityPatcher
          chmod +x release_pkg/AntigravityPatcher
          cp -r customization patcher_core release_pkg/
          cp patch-linux.sh release_pkg/
          chmod +x release_pkg/patch-linux.sh
          cp custom_wallpapers/README.txt release_pkg/custom_wallpapers/README.txt
          cp README.md LICENSE release_pkg/
          tar -czf AntigravityPatcher-linux-x64.tar.gz -C release_pkg .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityPatcher-${{ matrix.target }}
          path: |
            AntigravityPatcher-windows-x64.zip
            AntigravityPatcher-linux-x64.tar.gz

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AntigravityPatcher-windows-x64.zip
            AntigravityPatcher-linux-x64.tar.gz
