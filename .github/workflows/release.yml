name: Build Releases (Windows & Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Dual-Gate & Rust Tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies (for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Gate 1 — Python Core Tests
        run: python3 tests/run_all_tests.py

      - name: Gate 2 — Node.js Module Behavior Tests
        run: node tests/test_modules_behavior.js

      - name: Gate 3 — Rust Unit Tests
        run: cargo test --lib --manifest-path patcher/src-tauri/Cargo.toml

      - name: Frontend TypeScript / Vite Build Check
        run: |
          cd patcher
          npm ci
          npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Windows Patcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd patcher
          npm ci --no-fund --no-audit
          cargo tauri build --no-bundle
          cd ..
          New-Item -ItemType Directory -Force -Path release_pkg\custom_wallpapers | Out-Null
          Copy-Item patcher\src-tauri\target\release\ave-maria-patcher.exe release_pkg\AntigravityPatcher.exe
          Copy-Item -Recurse customization release_pkg\customization
          Copy-Item custom_wallpapers\README.txt release_pkg\custom_wallpapers\README.txt
          Copy-Item README.md, LICENSE release_pkg\
          Compress-Archive -Path release_pkg\* -DestinationPath AntigravityPatcher-windows-x64.zip -Force

      - name: Build Linux Patcher
        if: runner.os == 'Linux'
        run: |
          cd patcher
          npm ci --no-fund --no-audit
          cargo tauri build --no-bundle
          cd ..
          mkdir -p release_pkg/custom_wallpapers
          cp patcher/src-tauri/target/release/ave-maria-patcher release_pkg/AntigravityPatcher
          chmod +x release_pkg/AntigravityPatcher
          cp -r customization patcher_core release_pkg/
          cp patch-linux.sh release_pkg/
          chmod +x release_pkg/patch-linux.sh
          cp custom_wallpapers/README.txt release_pkg/custom_wallpapers/README.txt
          cp README.md LICENSE release_pkg/
          tar -czf AntigravityPatcher-linux-x64.tar.gz -C release_pkg .

      - name: Upload Windows build artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityPatcher-windows-x64
          path: AntigravityPatcher-windows-x64.zip

      - name: Upload Linux build artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityPatcher-linux-x64
          path: AntigravityPatcher-linux-x64.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_artifacts
          merge-multiple: true

      - name: Attach to GitHub Release (on tag push)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist_artifacts/AntigravityPatcher-windows-x64.zip
            dist_artifacts/AntigravityPatcher-linux-x64.tar.gz
