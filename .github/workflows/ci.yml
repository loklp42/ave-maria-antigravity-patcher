name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Python core & sanitization tests
        run: python tests/run_all_tests.py

      - name: Run JS module & runtime smoke tests
        run: node tests/test_modules_behavior.js

      - name: Build Patcher Frontend (TypeScript + Vite)
        working-directory: patcher
        run: |
          npm ci
          npm run build

      - name: Run Rust backend tests & check
        working-directory: patcher/src-tauri
        run: cargo test --lib
