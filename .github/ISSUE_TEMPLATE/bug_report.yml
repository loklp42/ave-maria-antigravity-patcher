name: "🐛 Bug report / Сообщить о баге"
description: "Сообщить об ошибке в патчере или кастомизации Antigravity"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: "Операционная система"
      options:
        - "Windows 11 / 10"
        - "Linux (Ubuntu / Debian)"
        - "Linux (Arch / Fedora / другой дистрибутив)"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Где возникла проблема?"
      options:
        - "Патчер (GUI / CLI)"
        - "Живые / фото-обои"
        - "Плеер (SMTC / MPRIS)"
        - "Русификация (RU / EN)"
        - "Мультиаккаунты / Вкладки"
        - "Интерфейс / Настройки персонализации"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Версия патчера и Antigravity"
      value: "v2.35.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Описание бага"
      description: "Кратко опишите, что пошло не так и что вы ожидали увидеть."
      placeholder: "Например: при нажатии на..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Шаги для воспроизведения"
      placeholder: |
        1. Открыть...
        2. Нажать...
        3. Происходит...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Скриншоты или журнал ошибок"
      description: "Перетащите скриншот или вставьте текст из вкладки «Журнал» в патчере."
      placeholder: "Необязательно"
