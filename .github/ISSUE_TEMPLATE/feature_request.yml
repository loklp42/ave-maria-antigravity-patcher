name: "💡 Feature request / Предложить идею"
description: "Предложить новую функцию или улучшение интерфейса"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "Что хочется добавить или улучшить?"
      placeholder: "Опишите вашу идею..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Зачем это нужно / сценарий использования"
      placeholder: "Как это сделает использование Antigravity удобнее?"
